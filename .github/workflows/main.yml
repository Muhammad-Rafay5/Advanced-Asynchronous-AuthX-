name: Advanced Auth CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: flake8 app

    - name: Security scan with Bandit
      run: bandit -r app -x app/tests

    - name: Run Async Tests
      env:
        ACCESS_TOKEN_SECRET: ci_test_access_secret_do_not_use_in_prod
        REFRESH_TOKEN_SECRET: ci_test_refresh_secret_do_not_use_in_prod
        ALGORITHM: HS256
        DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/auth_test"
        REDIS_HOST: "localhost"
        REDIS_PORT: "6379"
        USE_REDIS: "True"
      run: pytest
